name: release

# Builds the packages for the three desktop platforms and puts them into a
# GitHub release.
#
# The trigger is a tag: push v0.1.0 and the pipeline builds the three
# packages and creates the release "v0.1.0" with them. The version in the
# file names comes from the tag, so the tag and the packages cannot
# disagree.
#
# The text of the release is the section of the version in CHANGELOG.md
# (.github/scripts/changelog-notes.sh). A tag without such a section stops
# the pipeline before anything is built, so no release goes out without its
# notes.
#
# All packages are self-contained: the user unpacks the archive and runs
# the app, without installing a runtime. There is no installer on Windows
# and no AppImage on Linux - a tarball runs everywhere, an AppImage needs
# a FUSE that many systems do not have.

on:
  push:
    tags: ['v*']
  # Also build on a manual run, so the pipeline can be tried without
  # pushing a tag. The release is only created for a tag.
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag of the release (e.g. v0.1.0)'
        required: true
        type: string

permissions:
  contents: write

jobs:
  changelog:
    name: Changelog
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check that the changelog has notes for the version
        env:
          TAG: ${{ github.event.inputs.tag || github.ref_name }}
        run: .github/scripts/changelog-notes.sh "$TAG" > /dev/null

  build:
    name: ${{ matrix.name }}
    needs: changelog
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS (arm64)
            os: macos-latest
            rid: osx-arm64
            script: scripts/package-macos.sh
          - name: Windows (x64)
            os: windows-latest
            rid: win-x64
            script: scripts/package-windows.ps1
          - name: Linux (x64)
            os: ubuntu-latest
            rid: linux-x64
            script: scripts/package-linux.sh
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Package
        shell: bash
        run: |
          version="${{ github.event.inputs.tag || github.ref_name }}"
          version="${version#v}"
          case "${{ matrix.script }}" in
            *.ps1) pwsh -File "${{ matrix.script }}" -Version "$version" -Runtime "${{ matrix.rid }}" ;;
            *)      bash "${{ matrix.script }}" "$version" "${{ matrix.rid }}" ;;
          esac
      - name: Upload the package
        uses: actions/upload-artifact@v4
        with:
          name: oloop-${{ matrix.rid }}
          path: |
            dist/*.zip
            dist/*.tar.gz
          if-no-files-found: error

  release:
    name: Release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download the packages
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.inputs.tag || github.ref_name }}
        run: |
          # A release that exists already is updated, not duplicated. The
          # workflow can be run again for the same tag.
          #
          # The checkout is only there for the changelog and its script.
          # --repo stays explicit, so gh never has to guess the repository.
          repo="${{ github.repository }}"
          .github/scripts/changelog-notes.sh "$TAG" > notes.md
          if gh release view "$TAG" --repo "$repo" >/dev/null 2>&1; then
            gh release upload "$TAG" dist/* --clobber --repo "$repo"
            gh release edit "$TAG" --notes-file notes.md --repo "$repo"
            echo "Release $TAG updated."
          else
            gh release create "$TAG" dist/* \
              --repo "$repo" \
              --target "${{ github.sha }}" \
              --title "oloop $TAG" \
              --notes-file notes.md
            echo "Release $TAG created."
          fi
