name: release

# Publishes the app for the three desktop platforms and attaches the
# artifacts to a GitHub release. The pattern is the one of oloop-cli:
# the release is the trigger, the artifacts are attached to it.

on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  publish:
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            rid: linux-x64
          - os: windows-latest
            rid: win-x64
          - os: macos-latest
            rid: osx-arm64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Publish
        run: dotnet publish OloopApp.csproj --configuration Release --runtime ${{ matrix.rid }} --self-contained false --output out
      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: oloop-${{ matrix.rid }}
          path: out/
      - name: Attach to the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.release.tag_name }}
        run: gh release upload "$TAG" out --clobber
